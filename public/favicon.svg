<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C5CFC"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="32" height="32" fill="#0F0F0F" rx="7"/>
  <!-- Equalizer bars -->
  <g filter="url(#glow)" fill="url(#g)" rx="1.5">
    <rect x="5"  y="14" width="3.5" height="9"  rx="1.75"/>
    <rect x="10" y="10" width="3.5" height="13" rx="1.75"/>
    <rect x="15" y="7"  width="3.5" height="16" rx="1.75"/>
    <rect x="20" y="11" width="3.5" height="12" rx="1.75"/>
    <rect x="25" y="16" width="3.5" height="7"  rx="1.75"/>
  </g>
</svg>
